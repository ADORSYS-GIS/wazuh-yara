name: SonarQube

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Generate Coverage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats and Kcov
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq bats kcov; then
            echo "Installing kcov dependencies and building from source..."
            sudo apt-get install -y -qq bats cmake binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev libssl-dev build-essential libelf-dev
            git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
            cmake -S /tmp/kcov -B /tmp/kcov/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/kcov/build -j"$(nproc)"
            sudo cmake --install /tmp/kcov/build
          fi

      - name: Run Bats Tests with Coverage
        run: ./tests/run-coverage.sh

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yara-coverage-report
          path: coverage/sonar-coverage.xml
          retention-days: 1

  scan:
    name: SonarQube Scan
    needs: test
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sonarqube.yml@8617a17cfc5f5a8897c2a3806bb543c20b4b57e0 # main
    with:
      project-key: wazuh-yara
      generic-coverage-report-paths: "coverage/sonar-coverage.xml"
      coverage-artifact-name: "yara-coverage-report"
      coverage-artifact-path: "coverage"
      exclusions: "**/coverage/**,**/__pycache__/**"
      extra-sonar-args: -Dsonar.coverage.exclusions="tests/**,scripts/tests/**"
    secrets:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
